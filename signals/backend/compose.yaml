# Tripwire backend skeleton: docker compose up --build
#
#   db         Postgres + pgvector. On its FIRST start (empty volume) it runs
#              everything in migrations/ in name order. To apply a changed or new
#              migration: docker compose down -v (deletes the data), then up again.
#   seed       one project, one signal (+ v1), one cluster; runs once, then exits
#   poller     Laminar -> traces, every 10 s
#   runner     PLACEHOLDER: traces -> runs + some events, every 5 s
#   clusterer  events -> summaries -> vectors -> clusters every 10 s (needs OPENAI_API_KEY in .env;
#              CLUSTERER_MODE=placeholder runs without OpenAI). Has a healthcheck: `docker compose ps`.

x-backend: &backend
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://tripwire:tripwire@db:5432/tripwire
  restart: unless-stopped
  depends_on:
    seed:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tripwire
      POSTGRES_PASSWORD: tripwire
      POSTGRES_DB: tripwire
    ports:
      - "5434:5432"   # 5434 on your machine, so it doesn't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripwire -d tripwire"]
      interval: 2s
      timeout: 3s
      retries: 30

  seed:
    <<: *backend
    command: python -m tripwire.seed
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  poller:
    <<: *backend
    command: python -m tripwire.poller
    # Lets the container reach a Laminar running on this machine (self-hosted) at
    # http://host.docker.internal:8000. Not needed for Laminar Cloud.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  runner:
    <<: *backend
    command: python -m tripwire.runner

  clusterer:
    <<: *backend
    command: python -m tripwire.clusterer
    # Q12's rules ("is clustering working?"); `docker compose ps` shows healthy / unhealthy.
    # Compose only displays this, it never restarts. On AWS, ECS runs `--alive` instead, because
    # ECS restarts on failure (infra/docs/BACKEND_INFRA_NOTES.md). Keep the timing the same there.
    healthcheck:
      test: ["CMD", "python", "-m", "tripwire.clusterer.health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
